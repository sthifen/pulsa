[package]
name = "pulsa"
version = "0.3.1"
edition = "2024"
description = "La tablet como teclado y trackpad del PC"
license = "MIT"
repository = "https://github.com/sthifen/pulsa"

[features]
# Ventana nativa (GTK4 + libadwaita). Sin ella, el programa es un servidor
# estático sin dependencias del sistema (para la Raspberry o un servicio).
gui = ["dep:gtk", "dep:adw"]

[dependencies]
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"], optional = true }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"], optional = true }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
